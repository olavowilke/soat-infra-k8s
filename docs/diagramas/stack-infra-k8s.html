<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>infra-k8s - Diagrama da stack</title>

<style>
  html, body { margin: 0; background: #ffffff; }
  body { font-family: "Segoe UI", system-ui, sans-serif; width: 1400px; height: 900px; }
  h1 { margin: 0; padding: 18px 30px; font-size: 24px; color: #fff;
       background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  svg { display: block; }
  text { font-family: "Segoe UI", system-ui, sans-serif; fill: #1a202c; }
  .t { font-size: 15px; font-weight: 600; }
  .s { font-size: 12.5px; fill: #2d3748; }
  .g { font-size: 13px; font-weight: 700; fill: #4a5568; letter-spacing: .5px; }
  .w { fill: #fff; }
  .lbl { font-size: 12px; fill: #4a5568; }
</style>
</head>
<body>
<h1>infra-k8s — Diagrama da stack (Fase 4)</h1>
<svg width="1400" height="836" viewBox="0 0 1400 836">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38a169"/>
    </marker>
  </defs>

  <!-- ===== Entrada (fora da stack) ===== -->
  <rect x="30" y="40" width="190" height="64" rx="10" fill="#edf2f7" stroke="#a0aec0"/>
  <text x="125" y="67" text-anchor="middle" class="t">Cliente</text>
  <text x="125" y="88" text-anchor="middle" class="s">HTTPS + JWT</text>

  <rect x="30" y="150" width="190" height="78" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-dasharray="6 4"/>
  <text x="125" y="177" text-anchor="middle" class="t">API Gateway HTTP</text>
  <text x="125" y="197" text-anchor="middle" class="s">+ authorizer Lambda</text>
  <text x="125" y="215" text-anchor="middle" class="lbl">(stack lambda-auth)</text>

  <path d="M125,104 L125,148" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== VPC ===== -->
  <rect x="270" y="20" width="790" height="800" rx="14" fill="#f7fafc" stroke="#4299e1" stroke-width="2"/>
  <text x="290" y="46" class="g">VPC (esta stack) — sub-redes privadas</text>

  <!-- VPC Link -->
  <rect x="300" y="150" width="170" height="78" rx="10" fill="#4299e1"/>
  <text x="385" y="182" text-anchor="middle" class="t w">VPC Link</text>
  <text x="385" y="204" text-anchor="middle" class="s w">SG vpc-link</text>
  <path d="M220,189 L298,189" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>

  <!-- NLB -->
  <rect x="520" y="70" width="250" height="236" rx="10" fill="#4299e1"/>
  <text x="645" y="98" text-anchor="middle" class="t w">NLB interno (aws_lb.interno)</text>
  <rect x="540" y="114" width="210" height="52" rx="7" fill="#ebf8ff"/>
  <text x="645" y="136" text-anchor="middle" class="s">listener :80 → NodePort 30080</text>
  <text x="645" y="154" text-anchor="middle" class="lbl">criado aqui (oficina-api)</text>
  <rect x="540" y="176" width="210" height="52" rx="7" fill="#ebf8ff" stroke="#2b6cb0" stroke-dasharray="5 3"/>
  <text x="645" y="198" text-anchor="middle" class="s">listener :8081 → NodePort 30081</text>
  <text x="645" y="216" text-anchor="middle" class="lbl">criado pelo billing-service</text>
  <rect x="540" y="238" width="210" height="52" rx="7" fill="#ebf8ff" stroke="#2b6cb0" stroke-dasharray="5 3"/>
  <text x="645" y="260" text-anchor="middle" class="s">listener :8082 → NodePort 30082</text>
  <text x="645" y="278" text-anchor="middle" class="lbl">criado pelo execution-service</text>
  <path d="M470,189 L518,189" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>

  <!-- SG db-client -->
  <rect x="820" y="70" width="210" height="110" rx="10" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="925" y="98" text-anchor="middle" class="t">SG db-client</text>
  <text x="925" y="120" text-anchor="middle" class="s">"crachá" sem regra de entrada</text>
  <text x="925" y="140" text-anchor="middle" class="s">os RDS liberam 5432 só</text>
  <text x="925" y="158" text-anchor="middle" class="s">para quem veste este SG</text>

  <!-- ===== EKS ===== -->
  <rect x="300" y="350" width="730" height="450" rx="12" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/>
  <text x="320" y="376" class="g">Cluster EKS — managed node group</text>
  <text x="1010" y="376" text-anchor="end" class="lbl">nós vestem o SG db-client</text>
  <path d="M925,180 L925,348" stroke="#d69e2e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- NLB -> namespaces -->
  <path d="M645,306 L645,348" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>

  <!-- Namespaces -->
  <rect x="325" y="400" width="215" height="200" rx="10" fill="#ed8936"/>
  <text x="432" y="428" text-anchor="middle" class="t w">ns oficina</text>
  <text x="432" y="452" text-anchor="middle" class="s w">oficina-api (OS + Saga)</text>
  <text x="432" y="474" text-anchor="middle" class="s w">Service NodePort 30080</text>
  <text x="432" y="496" text-anchor="middle" class="s w">HPA CPU 60% · PDB</text>
  <text x="432" y="540" text-anchor="middle" class="lbl w">manifestos em</text>
  <text x="432" y="558" text-anchor="middle" class="lbl w">soat-oficina-api/k8s</text>

  <rect x="560" y="400" width="215" height="200" rx="10" fill="#ed8936"/>
  <text x="667" y="428" text-anchor="middle" class="t w">ns billing</text>
  <text x="667" y="452" text-anchor="middle" class="s w">billing-service</text>
  <text x="667" y="474" text-anchor="middle" class="s w">Service NodePort 30081</text>
  <text x="667" y="540" text-anchor="middle" class="lbl w">manifestos em</text>
  <text x="667" y="558" text-anchor="middle" class="lbl w">soat-billing-service/k8s</text>

  <rect x="795" y="400" width="215" height="200" rx="10" fill="#ed8936"/>
  <text x="902" y="428" text-anchor="middle" class="t w">ns execucao</text>
  <text x="902" y="452" text-anchor="middle" class="s w">execution-service</text>
  <text x="902" y="474" text-anchor="middle" class="s w">Service NodePort 30082</text>
  <text x="902" y="540" text-anchor="middle" class="lbl w">manifestos em</text>
  <text x="902" y="558" text-anchor="middle" class="lbl w">soat-execution-service/k8s</text>

  <!-- Add-ons -->
  <rect x="325" y="630" width="685" height="150" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="2"/>
  <text x="345" y="656" class="g" style="fill:#6b46c1">Add-ons (helm_release, esta stack)</text>
  <rect x="350" y="672" width="300" height="88" rx="8" fill="#9f7aea"/>
  <text x="500" y="705" text-anchor="middle" class="t w">metrics-server</text>
  <text x="500" y="728" text-anchor="middle" class="s w">métricas de CPU para os HPAs</text>
  <rect x="685" y="672" width="300" height="88" rx="8" fill="#9f7aea"/>
  <text x="835" y="705" text-anchor="middle" class="t w">nri-bundle (New Relic)</text>
  <text x="835" y="728" text-anchor="middle" class="s w">infra, logs e nri-prometheus</text>

  <!-- ===== Fora da VPC: ECR, SSM, New Relic ===== -->
  <rect x="1100" y="70" width="270" height="110" rx="10" fill="#4299e1"/>
  <text x="1235" y="100" text-anchor="middle" class="t w">Amazon ECR</text>
  <text x="1235" y="124" text-anchor="middle" class="s w">oficina-api (esta stack)</text>
  <text x="1235" y="146" text-anchor="middle" class="lbl w">os nós fazem pull da imagem</text>
  <text x="1235" y="164" text-anchor="middle" class="lbl w">billing e execution têm ECR próprio</text>
  <path d="M1030,398 L1100,182" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>

  <rect x="1100" y="290" width="270" height="250" rx="10" fill="#48bb78"/>
  <text x="1235" y="320" text-anchor="middle" class="t w">SSM Parameter Store</text>
  <text x="1235" y="342" text-anchor="middle" class="s w">/oficina/&lt;env&gt;/network/…</text>
  <text x="1235" y="360" text-anchor="middle" class="s w">/oficina/&lt;env&gt;/cluster/… (publicado aqui)</text>
  <text x="1120" y="392" class="s w">• vpc-id, vpc-cidr, subnets</text>
  <text x="1120" y="412" class="s w">• db-client-sg-id</text>
  <text x="1120" y="432" class="s w">• vpc-link-id</text>
  <text x="1120" y="452" class="s w">• nlb-arn, nlb-listener-arn</text>
  <text x="1120" y="472" class="s w">• node-asg-names</text>
  <text x="1120" y="492" class="s w">• cluster name e endpoint</text>
  <text x="1120" y="512" class="s w">• ecr-repository-url</text>
  <path d="M1060,420 L1098,420" stroke="#38a169" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="1100" y="560" width="270" height="76" rx="10" fill="#f0fff4" stroke="#38a169" stroke-dasharray="6 4"/>
  <text x="1235" y="584" text-anchor="middle" class="s">lido por: infra-database, lambda-auth,</text>
  <text x="1235" y="602" text-anchor="middle" class="s">oficina-api, billing-service,</text>
  <text x="1235" y="620" text-anchor="middle" class="s">execution-service</text>
  <path d="M1235,540 L1235,558" stroke="#38a169" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="1100" y="670" width="270" height="130" rx="10" fill="#9f7aea"/>
  <text x="1235" y="698" text-anchor="middle" class="t w">New Relic</text>
  <text x="1235" y="722" text-anchor="middle" class="s w">dashboards oficina e Saga</text>
  <text x="1235" y="742" text-anchor="middle" class="s w">alertas (DLQ, Saga FALHOU,</text>
  <text x="1235" y="762" text-anchor="middle" class="s w">p95, 5xx, uptime)</text>
  <text x="1235" y="784" text-anchor="middle" class="lbl w">terraform/newrelic.tf</text>
  <path d="M985,716 L1098,730" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
</svg>
