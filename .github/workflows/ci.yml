name: CI - Infra K8s

on:
  push:
    branches: [main, homolog]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  terraform:
    name: Terraform fmt e validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  kustomize:
    name: Validar manifestos Kubernetes (kustomize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Os manifestos Kubernetes da oficina-api passaram para o repositorio
      # soat-oficina-api (Fase 4); aqui nao ha mais overlay para renderizar.
      # O job continua com este nome porque ele e um check obrigatorio.
      - name: Sem manifestos neste repositorio
        run: echo "Manifestos da oficina-api vivem em soat-oficina-api/k8s."
