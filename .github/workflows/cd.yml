name: CD - Deploy EKS (infraestrutura)

# Deploy automatico da branch main no ambiente homolog (Fase 4).
#   main -> ambiente homolog
# A variavel de repositorio DEPLOY_HOMOLOG controla o deploy: so roda se for "true".
# Ordem entre stacks: infra-k8s -> infra-database -> lambda-auth -> aplicacao.
# Esta pipeline cria/atualiza so a infraestrutura (VPC, EKS, NLB, ECR, add-ons,
# New Relic). Os manifestos da oficina-api, o Secret oficina-secrets e o
# rollout da imagem pertencem ao repositorio soat-oficina-api (Fase 4).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente alvo
        required: true
        default: homolog
        type: choice
        options: [homolog]

permissions:
  id-token: write # OIDC para assumir a role na AWS, sem chave estatica
  contents: read

concurrency:
  group: cd-homolog
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_HOMOLOG == 'true'
    name: terraform apply
    runs-on: ubuntu-latest
    environment: homolog
    env:
      AMBIENTE: homolog
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-k8s/${AMBIENTE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # New Relic e o monitor sintetico de uptime sao opcionais (variaveis
      # com default vazio no Terraform, guardadas por `count`): se as
      # variaveis/secrets do GitHub Actions abaixo nao existirem no
      # repositorio, `${{ ... }}` resolve para string vazia e o stack
      # continua subindo normalmente, so sem esses recursos. TF_VAR_* em
      # vez de `-var=...` para os valores sensiveis nao aparecerem no
      # comando renderizado no log do Actions.
      - name: terraform plan
        working-directory: terraform
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          TF_VAR_newrelic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
          TF_VAR_uptime_check_url: ${{ vars.UPTIME_CHECK_URL }}
        run: |
          terraform plan -input=false \
            -var-file=environments/${AMBIENTE}.tfvars \
            -out=tfplan

      - name: terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
