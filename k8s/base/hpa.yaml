# Horizontal Pod Autoscaler — escala a aplicação por consumo de CPU.
# Requer o metrics-server instalado no cluster (ver infra-k8s/terraform/addons.tf).
# min/maxReplicas abaixo são o padrão; cada overlay de ambiente ajusta os
# limites via patch (homolog: 1-3, prod: 2-10).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  # Sem métrica de memória, de propósito. A JVM reserva o heap e não devolve:
  # em repouso o pod fica em 411 Mi contra um request de 512 Mi, ou seja 77% —
  # acima de qualquer alvo razoável, e sem relação nenhuma com carga. O HPA
  # nunca alcançava o alvo, escalava até maxReplicas e travava o rollout,
  # porque o nó não comporta réplicas que só existem para satisfazer uma
  # métrica que nunca cai. CPU sobe com carga real e volta quando ela passa.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
