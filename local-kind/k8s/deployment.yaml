apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-api
        app.kubernetes.io/part-of: oficina
    spec:
      containers:
        - name: oficina-api
          # Sobrescrito pelo CI (kustomize edit set image) para a tag do GHCR.
          # Local (kind): use `kind load docker-image oficina-api:latest`.
          image: oficina-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: oficina-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: JWT_SECRET
            - name: WEBHOOK_ORCAMENTO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: WEBHOOK_ORCAMENTO_TOKEN
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: MAIL_PASSWORD
          resources:
            requests:
              # requests de CPU são essenciais para o HPA calcular a utilização
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: oficina-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
