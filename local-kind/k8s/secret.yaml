apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina
type: Opaque
# Valores de exemplo do cluster kind local, e SÓ dele. Este arquivo está num
# repositório público: trate tudo abaixo como conhecido por qualquer pessoa.
# Nenhum ambiente na AWS lê este arquivo — lá o Secret `oficina-secrets` é
# montado pela pipeline a partir do Secrets Manager (ver
# infra-k8s/.github/workflows/cd.yml). Nunca versione segredo real aqui.
stringData:
  DB_PASSWORD: "oficina"
  POSTGRES_PASSWORD: "oficina"
  JWT_SECRET: "ZmljYXAtb2ZpY2luYS1hcGktc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmch"
  # O prefixo "local-" é proposital: o valor antigo começava com "prod-" e
  # parecia um token de produção vazado neste arquivo.
  WEBHOOK_ORCAMENTO_TOKEN: "local-webhook-token-change-me"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
